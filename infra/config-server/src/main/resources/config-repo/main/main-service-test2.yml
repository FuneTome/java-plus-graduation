spring:
  datasource:
    url: "jdbc:h2:mem:ewm_db;DB_CLOSE_DELAY=-1;MODE=PostgreSQL"
    username: main
    password: main
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        show_sql: false
        format_sql: false

server:
  port:
    0

logging:
  level:
    root: INFO
    org:
      hibernate: WARN
      hibernate.SQL: WARN
      hibernate.type.descriptor.sql: WARN
      springframework:
        web:
          filter:
            CommonsRequestLoggingFilter: DEBUG
    ru:
      practicum:
        main: DEBUG